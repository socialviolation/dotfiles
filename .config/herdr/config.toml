onboarding = false
[theme]
name = "catppuccin"

[theme.custom]
red = "#ff1744"
peach = "#ff9100"
yellow = "#ffea00"
green = "#00e676"
mauve = "#d05cff"
teal = "#00e5ff"
accent = "#00e5ff"
overlay0 = "#7d8798"
subtext0 = "#c3cbd9"

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.sidebar.agents]
rows = [
    [{ token = "state_icon", bold = true }, "workspace", "tab"],
    ["terminal_title"],
    [{ token = "state_text", bold = true }, "agent", "$ctx", { token = "$ctx_warn", fg = "#ffea00" }, { token = "$ctx_crit", fg = "#ff1744" }],
]

[ui.sidebar.spaces]
rows = [
    [{ token = "state_icon", bold = true }, "workspace"],
    ["branch", "git_status"],
]

[keys]
prefix = "ctrl+space"
detach = "prefix+d"
split_vertical = "prefix+\""
split_horizontal = "prefix+%"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "sh -c $HOME/.config/herdr/focus-attention.sh"
description = "jump to the agent that just finished"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+minus"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump to previous workspace"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "devstack.open-panel"
description = "open the devstack panel in split"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "devstack.open-links"
description = "open a service address in the browser"
