# Workspace Rules for Multi-Monitor Setup
# See https://wiki.hypr.land/Configuring/Workspace-Rules/

# Left monitor (HDMI-A-1) - Workspace 1 (terminal)
workspace = 1, monitor:HDMI-A-1, default:true

# Right monitor (HDMI-A-2) - Workspaces 2-5 (browser, slack, music, extra)
workspace = 2, monitor:HDMI-A-2, default:true
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2
